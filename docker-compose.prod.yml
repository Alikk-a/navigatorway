# Production stack: Postgres + Gunicorn + Nginx.
# Legacy MariaDB import: use docker-compose.yml (not this file).
services:
  db:
    image: postgres:16-alpine
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  web:
    build: .
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - staticfiles:/app/staticfiles
      - ./media:/app/media
    expose:
      - "8000"

  nginx:
    image: nginx:alpine
    ports:
      # Host :80 often taken by Traefik/Dokploy; use Tailscale or Cloudflare Tunnel to this port.
      - "${NGINX_PUBLISH_PORT:-8088}:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - staticfiles:/staticfiles:ro
      - ./media:/media:ro
    depends_on:
      - web

volumes:
  pgdata:
  staticfiles:
